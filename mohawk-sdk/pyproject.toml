[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mohawk-sdk"
version = "3.0.0"
description = "User-friendly SDK for Mohawk Inference Engine - multi-device inference management"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Mohawk Ops Team", email = "mohawk@sovereign-mohawk-proto.io"},
]
keywords = [
    "inference",
    "ml",
    "distributed",
    "quantum-safe",
    "pqc",
    "neural-networks",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24.0",
    "requests>=2.31.0",
    "tomli>=2.0.0; python_version<'3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.7.0",
    "black>=23.12.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/rwilliamspbg-ops/Mohawk-Inference-Engine"
Documentation = "https://github.com/rwilliamspbg-ops/Mohawk-Inference-Engine/blob/main/mohawk-sdk/README.md"
Repository = "https://github.com/rwilliamspbg-ops/Mohawk-Inference-Engine"

[tool.hatch.build.targets.wheel]
packages = ["mohawk_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 88
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
]
ignore = [
    "E501",  # line too long (handled by black)
]
