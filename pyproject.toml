[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mohawk-inference-engine"
version = "0.1.0"
description = "A high-performance, lightweight, and secure local inference engine for LLMs"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Mohawk Team"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["llm", "inference", "ai", "machine-learning", "nlp"]
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "transformers>=4.35.0",
    "torch>=2.0.0",
    "accelerate>=0.24.0",
    "huggingface-hub>=0.19.0",
]

[project.optional-dependencies]
gpu = [
    "torch-cuda>=2.0.0",
]
gguf = [
    "llama-cpp-python>=0.2.0",
]
onnx = [
    "onnxruntime>=1.16.0",
]
gui = [
    "gradio>=4.0.0",
    "plotly>=5.18.0",
    "psutil>=5.9.0",
    "websockets>=12.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[project.scripts]
mohawk = "mohawk.cli:main"
mohawk-server = "mohawk.server:main"
mohawk-gui = "mohawk.gui.app:main"

[project.urls]
Homepage = "https://github.com/mohawk-inference-engine"
Repository = "https://github.com/mohawk-inference-engine/mohawk"
Documentation = "https://github.com/mohawk-inference-engine/mohawk#readme"

[tool.setuptools.packages.find]
where = ["."]
include = ["mohawk*"]

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = []

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
