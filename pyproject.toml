[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mohawk-inference-engine-gui"
version = "2.1.0"
description = "Production-ready GUI for Mohawk Inference Engine with multi-device inference management"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Mohawk Inference Engine Team", email = "team@mohawk-inference.example.com"}
]
keywords = ["inference", "gpu", "ml", "distributed", "gui"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "PyQt6>=6.5.0",
    "cryptography>=41.0.0",
    "PyJWT>=2.8.0",
    "psutil>=5.9.0",
    "websockets>=11.0",
    "pyqtgraph>=0.13.0",
    "tomli>=2.0.1",
    "pydantic>=2.5.0",
    "httpx>=0.24.0",
    "aiohttp>=3.9.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-qt>=4.2.0",
    "black>=23.12.0",
    "flake8>=6.1.0",
    "mypy>=1.5.0",
    "bandit>=1.7.0",
]

[project.scripts]
mohawk-gui = "mohawk_gui.main:main"

[tool.setuptools.packages.find]
include = ["mohawk_gui*"]

[tool.setuptools.package-data]
mohawk_gui = ["resources/**/*", "*.toml", "*.conf"]

# =============================================================================
# PYINSTALLER CONFIGURATION
# =============================================================================

[tool.pyinstaller]
name = "Mohawk Inference Engine"
description = "Production-ready GUI for multi-device inference management"
version = "2.1.0"
icon = "resources/icons/app.ico"  # Windows icon
onefile = true                    # Single executable
addindent = 2                     # Indentation for specs
hiddenimports = [
    "mohawk_gui.main",
    "mohawk_gui.auth_manager",
    "mohawk_gui.connection_pool",
    "mohawk_gui.metrics_buffer",
    "mohawk_gui.error_recovery",
    "mohawk_gui.monitoring",
    "mohawk_gui.audit_logger",
    "mohawk_gui.main_window",
]
datas = [
    "mohawk_gui/resources/*:*",
    "mohawk_gui/resources/icons/*:*",
    "mohawk_gui/resources/themes/*:*",
]
# Add data files for Linux/Mac
add_data = [
    ("mohawk_gui/resources/config.toml", "config.toml"),
]

[tool.pyinstaller.analyse]
imported_packages = []

[tool.pyinstaller.build]
path_excludes = ["*.pyc", "__pycache__", "*.egg-info"]

# =============================================================================
# DOCKER CONFIGURATION
# =============================================================================

[tool.docker]
image_name = "mohawk-inference-gui"
image_tag = "latest"
base_image = "python:3.11-slim"
workdir = "/app"
expose_ports = ["8003", "8443"]
healthcheck_path = "/health"
