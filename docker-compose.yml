# Mohawk Inference Engine GUI - Docker Compose
# Version: 2.1.0

version: '3.8'

services:
  mohawk-gui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mohawk-gui
    ports:
      - "8003:8003"
      - "8443:8443"
    volumes:
      - ./mohawk_gui:/app/mohawk_gui
      - ./certs:/app/certs
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    command: >
      python mohawk_gui/main.py       --host ${HOST:-localhost}       --port ${PORT:-8003}
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  mohawk-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: mohawk-worker
    ports:
      - "8003:8003"
    volumes:
      - ./models:/app/models
      - ./certs:/app/certs
    command: python prototype/worker_secure.py --port 8003
    restart: unless-stopped

networks:
  default:
    name: mohawk-network

