services:
  mohawk-gui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mohawk-gui
    ports:
      - "8003:8003"
      - "8443:8443"
    volumes:
      - ./mohawk_gui:/app/mohawk_gui
      - ./certs:/app/certs
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - QT_QPA_PLATFORM=offscreen
      - DISCOVERY=true
    command: >
      python -m uvicorn prototype.gui_backend:app
      --host 0.0.0.0 --port 8003
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - mohawk-network

  mohawk-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: mohawk-worker
    ports:
      - "8004:8003"
    volumes:
      - ./models:/app/models
      - ./certs:/app/certs
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - QT_QPA_PLATFORM=offscreen
      - DISCOVERY=true
    command: >
      python -m uvicorn prototype.worker_secure:app
      --host 0.0.0.0 --port 8003
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - mohawk-network

networks:
  mohawk-network:
    name: mohawk-network
    driver: bridge
