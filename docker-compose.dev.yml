version: '3.8'

services:
  controller:
    build:
      context: .
      dockerfile: Dockerfile.controller
    ports:
      - "8000:8000"
    environment:
      - WORKER_URLS=http://worker1:8001,http://worker2:8002
    depends_on:
      - worker1
      - worker2

  worker1:
    build:
      context: .
      dockerfile: Dockerfile.worker
    ports:
      - "8001:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0

  worker2:
    build:
      context: .
      dockerfile: Dockerfile.worker
    ports:
      - "8002:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0

  # Secure worker for PQC testing
  worker_secure:
    build:
      context: .
      dockerfile: Dockerfile.worker
    ports:
      - "8003:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
